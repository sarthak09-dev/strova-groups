<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#1D4ED8" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chromeRing" x1="120" y1="120" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cobaltRing" x1="160" y1="140" x2="480" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="slateHalo" x1="80" y1="320" x2="560" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="crystalFacet1" x1="260" y1="240" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="crystalFacet2" x1="280" y1="220" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="panelGrad1" x1="0" y1="0" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="panelGrad2" x1="0" y1="0" x2="150" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <!-- Ambient background orb -->
  <circle cx="320" cy="320" r="270" fill="url(#ambientGlow)" />

  <!-- Outer Fine Horizon Halo (Tilted ellipse) -->
  <ellipse cx="320" cy="320" rx="275" ry="115" stroke="url(#slateHalo)" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(-15 320 320)" opacity="0.85" />

  <!-- Outer Aerospace Ring (Cobalt alloy) -->
  <ellipse cx="320" cy="320" rx="235" ry="195" stroke="url(#cobaltRing)" stroke-width="4.5" transform="rotate(28 320 320)" />
  <ellipse cx="320" cy="320" rx="233" ry="193" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" transform="rotate(28 320 320)" />

  <!-- Middle Chronometer Ring (Dark Slate) -->
  <ellipse cx="320" cy="320" rx="185" ry="155" stroke="#1E293B" stroke-width="6" transform="rotate(-38 320 320)" />
  <ellipse cx="320" cy="320" rx="185" ry="155" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" transform="rotate(-38 320 320)" />

  <!-- Orbital Satellites on Middle Ring -->
  <circle cx="178" cy="225" r="8" fill="#1D4ED8" filter="url(#glow)" />
  <circle cx="178" cy="225" r="5" fill="#93C5FD" />
  <circle cx="462" cy="415" r="7" fill="#1D4ED8" filter="url(#glow)" />
  <circle cx="462" cy="415" r="4.5" fill="#93C5FD" />
  <circle cx="370" cy="180" r="6" fill="#3B82F6" filter="url(#glow)" />
  <circle cx="370" cy="180" r="4" fill="#DBEAFE" />

  <!-- Inner Liquid Chrome Gimbal Ring -->
  <ellipse cx="320" cy="320" rx="135" ry="120" stroke="url(#chromeRing)" stroke-width="4" transform="rotate(62 320 320)" />
  <ellipse cx="320" cy="320" rx="133" ry="118" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6" transform="rotate(62 320 320)" />

  <!-- Central Faceted Crystalline Core -->
  <g filter="url(#glow)">
    <polygon points="320,205 390,265 320,320 250,265" fill="url(#crystalFacet1)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />
    <polygon points="320,320 390,265 405,345 340,395" fill="url(#crystalFacet2)" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="320,320 250,265 235,345 300,395" fill="url(#crystalFacet1)" stroke="#2563EB" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="320,320 340,395 320,435 300,395" fill="url(#crystalFacet2)" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.8" />
    <polygon points="250,265 320,205 320,175 230,230" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
    <polygon points="390,265 320,205 320,175 410,230" fill="#1E293B" fill-opacity="0.8" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Glowing Singularity at Core -->
  <circle cx="320" cy="310" r="14" fill="#3B82F6" fill-opacity="0.35" filter="url(#glow)" />
  <circle cx="320" cy="310" r="7" fill="#FFFFFF" />

  <!-- Floating Dimensional Interface Panel 1: Top-Right (Web Platform) -->
  <g transform="matrix(0.96, -0.06, 0.08, 0.98, 410, 130)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="160" height="96" rx="8" fill="url(#panelGrad1)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="0" y="0" width="160" height="18" rx="8" fill="#1E293B" />
    <circle cx="10" cy="9" r="2.5" fill="#EF4444" />
    <circle cx="18" cy="9" r="2.5" fill="#F59E0B" />
    <circle cx="26" cy="9" r="2.5" fill="#10B981" />
    <rect x="36" y="6" width="70" height="6" rx="2" fill="#334155" />
    <rect x="12" y="28" width="80" height="7" rx="2" fill="#F8FAFC" />
    <rect x="12" y="42" width="60" height="20" rx="3" fill="#0F172A" stroke="#22D3EE" stroke-width="0.8" />
    <rect x="80" y="42" width="68" height="20" rx="3" fill="#0F172A" stroke="#818CF8" stroke-width="0.8" />
    <rect x="12" y="70" width="136" height="5" rx="1.5" fill="#475569" opacity="0.6" />
    <rect x="12" y="80" width="90" height="5" rx="1.5" fill="#475569" opacity="0.4" />
  </g>

  <!-- Floating Dimensional Interface Panel 2: Bottom-Left (AI & Automation) -->
  <g transform="matrix(0.96, 0.08, -0.06, 0.98, 75, 385)" filter="url(#panelShadow)">
    <rect x="0" y="0" width="150" height="90" rx="8" fill="url(#panelGrad2)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="12" y="14" width="90" height="6" rx="2" fill="#F8FAFC" />
    <rect x="12" y="28" width="34" height="24" rx="3" fill="#1E1B4B" stroke="#C084FC" stroke-width="0.8" />
    <line x1="46" y1="40" x2="58" y2="40" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="2 2" />
    <rect x="58" y="28" width="34" height="24" rx="3" fill="#1E1B4B" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="92" y1="40" x2="104" y2="40" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" />
    <rect x="104" y="28" width="34" height="24" rx="3" fill="#1E1B4B" stroke="#10B981" stroke-width="0.8" />
    <rect x="12" y="60" width="126" height="18" rx="3" fill="#090714" stroke="#475569" stroke-width="0.6" />
  </g>

  <!-- Ambient Micro Accents -->
  <circle cx="210" cy="140" r="2" fill="#3B82F6" opacity="0.6" />
  <circle cx="440" cy="160" r="2.5" fill="#60A5FA" opacity="0.6" />
  <circle cx="490" cy="270" r="1.5" fill="#94A3B8" opacity="0.8" />
  <circle cx="150" cy="390" r="2" fill="#3B82F6" opacity="0.5" />
  <circle cx="230" cy="480" r="1.5" fill="#60A5FA" opacity="0.5" />
  <circle cx="430" cy="470" r="2" fill="#94A3B8" opacity="0.7" />
  <circle cx="120" cy="280" r="1.5" fill="#3B82F6" opacity="0.5" />
  <circle cx="530" cy="360" r="2" fill="#60A5FA" opacity="0.7" />
</svg>
