<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chromeRing" x1="120" y1="120" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="indigoRing" x1="160" y1="140" x2="480" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="cyanHalo" x1="80" y1="320" x2="560" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="crystalFacet1" x1="260" y1="240" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="crystalFacet2" x1="280" y1="220" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Ambient background orb -->
  <circle cx="320" cy="320" r="260" fill="url(#ambientGlow)" />

  <!-- Outer Fine Horizon Halo (Tilted ellipse) -->
  <ellipse cx="320" cy="320" rx="270" ry="110" stroke="url(#cyanHalo)" stroke-width="1.5" stroke-dasharray="4 8" transform="rotate(-15 320 320)" opacity="0.85" />

  <!-- Outer Aerospace Ring (Indigo alloy) -->
  <ellipse cx="320" cy="320" rx="235" ry="195" stroke="url(#indigoRing)" stroke-width="5" transform="rotate(28 320 320)" />
  <ellipse cx="320" cy="320" rx="233" ry="193" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" transform="rotate(28 320 320)" />

  <!-- Middle Chronometer Ring (Dark Titanium) -->
  <ellipse cx="320" cy="320" rx="185" ry="155" stroke="#334155" stroke-width="7" transform="rotate(-38 320 320)" />
  <ellipse cx="320" cy="320" rx="185" ry="155" stroke="#6366F1" stroke-width="1" stroke-opacity="0.7" transform="rotate(-38 320 320)" />

  <!-- Orbital Satellites on Middle Ring -->
  <circle cx="178" cy="225" r="9" fill="#6366F1" filter="url(#glow)" />
  <circle cx="178" cy="225" r="6" fill="#A5B4FC" />
  <circle cx="462" cy="415" r="8" fill="#6366F1" filter="url(#glow)" />
  <circle cx="462" cy="415" r="5" fill="#A5B4FC" />
  <circle cx="370" cy="180" r="7" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="370" cy="180" r="4.5" fill="#E0F2FE" />

  <!-- Inner Liquid Chrome Gimbal Ring -->
  <ellipse cx="320" cy="320" rx="135" ry="120" stroke="url(#chromeRing)" stroke-width="4.5" transform="rotate(62 320 320)" />
  <ellipse cx="320" cy="320" rx="133" ry="118" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6" transform="rotate(62 320 320)" />

  <!-- Central Faceted Crystalline Core -->
  <g filter="url(#glow)">
    <!-- Facet paths creating faceted icosahedron/octahedron -->
    <polygon points="320,205 390,265 320,320 250,265" fill="url(#crystalFacet1)" stroke="#67E8F9" stroke-width="1" stroke-opacity="0.8" />
    <polygon points="320,320 390,265 405,345 340,395" fill="url(#crystalFacet2)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="320,320 250,265 235,345 300,395" fill="url(#crystalFacet1)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="320,320 340,395 320,435 300,395" fill="url(#crystalFacet2)" stroke="#A5B4FC" stroke-width="1" stroke-opacity="0.8" />
    <polygon points="250,265 320,205 320,175 230,230" fill="#0E172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
    <polygon points="390,265 320,205 320,175 410,230" fill="#1E1B4B" fill-opacity="0.8" stroke="#818CF8" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Glowing Singularity at Core -->
  <circle cx="320" cy="310" r="16" fill="#22D3EE" fill-opacity="0.4" filter="url(#glow)" />
  <circle cx="320" cy="310" r="8" fill="#FFFFFF" />

  <!-- Ambient Dust Particles -->
  <circle cx="210" cy="140" r="2.5" fill="#22D3EE" opacity="0.8" />
  <circle cx="440" cy="160" r="3" fill="#818CF8" opacity="0.75" />
  <circle cx="490" cy="270" r="2" fill="#E2E8F0" opacity="0.9" />
  <circle cx="150" cy="390" r="2.5" fill="#22D3EE" opacity="0.7" />
  <circle cx="230" cy="480" r="2" fill="#818CF8" opacity="0.6" />
  <circle cx="430" cy="470" r="2.5" fill="#E2E8F0" opacity="0.8" />
  <circle cx="120" cy="280" r="1.5" fill="#22D3EE" opacity="0.7" />
  <circle cx="530" cy="360" r="2" fill="#818CF8" opacity="0.85" />
</svg>
