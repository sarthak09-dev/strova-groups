name: "Strova Group CI & Production Release Gate"

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      trigger_release_gate:
        description: "Run protected production release gate"
        required: false
        default: "true"
        type: boolean

jobs:
  verify:
    name: "Source CI: Security, Test, TypeCheck, Build & Route Audit"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Clean Install from Lockfile"
        run: npm ci

      - name: "Automated Secret Scanning Gate (Source & Tracked Files)"
        run: npm run scan:secrets

      - name: "Verify PostgreSQL Migration Privileges & RLS Grants (Static AST)"
        run: npm run verify:db

      - name: "Security, Tenant Isolation & Concurrency Tests (Suites 1-26)"
        run: npm test

      - name: "Preflight Configuration Validation (Test Mode)"
        run: npm run preflight -- --mode=test

      - name: "Astro & TypeScript Compiler Diagnostics"
        run: npm run astro:check

      - name: "Build Production Marketing Website"
        run: npm run build

      - name: "Build Production Client Portal"
        run: npm run build:portal

      - name: "Automated Secret Scanning Gate (Build Outputs: dist/ & portal/dist/)"
        run: npm run scan:secrets

      - name: "Full-Path Route, Asset, Anchor & Local HTTP Smoke Tests"
        run: npm run verify:routes

      - name: "Production HTML Standards, SEO & JS Budget Audit"
        run: npm run audit

      - name: "Strict Dependency Vulnerability Audit Gate (Zero Exceptions)"
        run: npm run audit:deps

  # Protected production release gate: strictly separated from ordinary source CI
  production-release-gate:
    name: "Protected Production Release Gate"
    runs-on: ubuntu-latest
    needs: [verify]
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Dependencies from Lockfile"
        run: npm ci

      - name: "Verify Live Database Permissions & RLS (Fail-Closed Gate)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured in the production environment. The production release gate requires live database privilege verification."
            exit 1
          fi
          echo "Executing live database privilege verification against Supabase..."
          npm run verify:db:live

      - name: "Verify Production Configuration & Secrets (Fail-Closed Gate)"
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          PORTAL_SIGNING_SECRET: ${{ secrets.PORTAL_SIGNING_SECRET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          FORMSPREE_KEY: ${{ secrets.FORMSPREE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$RAZORPAY_KEY_SECRET" ] || [ -z "$RAZORPAY_WEBHOOK_SECRET" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::Required production secrets are missing from the production environment. The production release gate cannot pass without verified configuration."
            exit 1
          fi
          echo "Executing production preflight against configured secrets..."
          npm run preflight:prod

      - name: "Verify Live Production HTTPS Endpoints (Fail-Closed Gate)"
        run: |
          echo "Executing remote HTTPS endpoint verification for production domains..."
          npm run verify:routes -- --require-live-domains
