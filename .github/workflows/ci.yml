name: Strova Group CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Database Privileges & Function Signatures
        run: npm run verify:db

      - name: Run Security & Isolation Tests
        run: npm test

      - name: Preflight Security & Configuration Check (Test Mode)
        run: npm run preflight -- --mode=test

      - name: Astro & TypeScript Diagnostics
        run: npm run astro:check

      - name: Build Marketing Site
        run: npm run build

      - name: Build Client Portal
        run: npm run build:portal

      - name: Run Production Audit
        run: npm run audit

      - name: Dependency Vulnerability Review
        run: |
          npm audit || echo "Advisories noted: Astro upstream framework advisory mitigated by 100% static prerendered architecture."

